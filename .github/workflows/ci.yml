name: CI

# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches:
      - "master"
      - "ci"
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.x"
    paths:
      - "**.py"
  pull_request:
    branches:
      - "master"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  linters-ruff:
    runs-on: ubuntu-latest
    steps:
      - name: source code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: '3.13'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Check code style
        run: uv run ruff check async_firebase && uv run ruff format --check async_firebase

  linters-mypy:
    runs-on: ubuntu-latest
    steps:
      - name: source code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: '3.13'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Static type checker
        run: uv run mypy --install-types --non-interactive --no-error-summary --hide-error-codes --follow-imports=skip async_firebase

  test:
    needs: [ linters-ruff, linters-mypy ]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ '3.10', '3.11', '3.12', '3.13', '3.14' ]
    steps:
      - name: source code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run pytest
        run: uv run pytest tests/

      - name: Submit coverage report
        if: github.ref == 'refs/heads/master'
        uses: codacy/codacy-coverage-reporter-action@v1
        with:
          project-token: ${{ secrets.CODACY_TOKEN }}
          coverage-reports: coverage.xml

  integration-test:
    needs: [ linters-ruff, linters-mypy ]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - name: source code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: '3.13'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run FCM payload validation tests
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_KEY_JSON" > /tmp/firebase-sa.json
          FIREBASE_SERVICE_ACCOUNT_KEY=/tmp/firebase-sa.json uv run pytest -m integration -v
